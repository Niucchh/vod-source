name: update-vod-sources

on:
  schedule:
    # 每天 07:20（北京时间）自动跑一次；源站有变动才提交，避免无意义 commit
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vod-sources
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成配置
        run: |
          cat > /tmp/build_config.py <<'PY'
          #!/usr/bin/env python3
          """空壳影视（MacCMS App）自定义源配置自动生成脚本。

          作用：
          1. 读取仓库根目录已有的 config.json 作为基础清单（保留人工命名、隐私码、屏蔽分类）；
          2. 从持续维护的公开源清单拉取候选源，逐个实测，只把「本次实测可用且 URL 未重复」的源追加进去；
          3. 已有点播源按实测结果刷新片库数量描述，不会自动删除（避免机器 IP 被拦时误删可用源）；
          4. 按片库量降序重写 config.json，供 GitHub Pages 直接对外提供。
          """

          import base64
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          CONFIG_PATH = "config.json"
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          # 屏蔽分类清单；留空表示不做任何分类屏蔽
          BLOCK_TYPES = []

          FEEDS = [
              # 每日 Actions 实测的苹果 CMS 源清单
              ("andywe", "https://raw.githubusercontent.com/andywe0921-ops/applecms-sources/main/applecms_sources.json"),
              # 路由器机器人验活的纯 URL 清单（base64）
              ("yh", "https://raw.githubusercontent.com/YH-Music/vod-sources/main/vod.b64"),
          ]


          def http_get(url, timeout=20):
              req = urllib.request.Request(url, headers=UA)
              return urllib.request.urlopen(req, timeout=timeout).read().decode("utf-8", "ignore")


          # ---------- 分类体系（typeConfig） ----------
          # 片单式专题：这几类分类名本身就是"榜单/片单"性质，单独提成一级
          SPECIAL_GROUPS = [
              ("4K 片单", ("4k",)),
              ("Netflix 片单", ("netflix", "奈飞")),
              ("邵氏经典", ("邵氏",)),
              ("豆瓣高分片单", ("豆瓣",)),
              ("IMDb 片单", ("imdb",)),
              ("纪录片", ("纪录", "记录")),
              ("解说与预告", ("解说", "预告")),
          ]
          GROUP_ORDER = [
              "电影", "电视剧", "动漫", "综艺", "短剧", "纪录片", "4K 片单",
              "Netflix 片单", "邵氏经典", "豆瓣高分片单", "IMDb 片单",
              "解说与预告", "体育", "AI 制作", "其他",
          ]
          PARENT_RENAME = {"体育赛事": "体育", "AI制作": "AI 制作", "电视剧集": "电视剧"}


          def norm_parent(name):
              """站点的一级名五花八门（电影片 / 连续剧 / 动漫片 / 短剧大全 …），统一成本项目的标准组名。"""
              if not name:
                  return None
              if name in PARENT_RENAME:
                  return PARENT_RENAME[name]
              for g, kws in (("纪录片", ("纪录", "纪实")),
                             ("解说与预告", ("解说", "预告", "花絮")),
                             ("短剧", ("短剧", "微剧", "竖屏")),
                             ("体育", ("体育", "赛事", "足球", "篮球", "电竞")),
                             ("综艺", ("综艺", "演唱会", "晚会")),
                             ("动漫", ("动漫", "动画", "漫画")),
                             ("电视剧", ("电视剧", "连续剧", "剧集", "剧场", "剧")),
                             ("电影", ("电影", "影片", "大片"))):
                  if any(k in name for k in kws):
                      return g
              if any(k in name for k in ("资讯", "新闻", "其他", "推荐", "榜单")):
                  return "其他"
              return name


          def special_group(name):
              low = (name or "").lower()
              for g, kws in SPECIAL_GROUPS:
                  if any(k in low for k in kws):
                      return g
              return None


          SHORT_KWS = ("短剧", "爽剧", "短剧", "穿越", "总裁", "民国", "年代", "脑洞", "都市",
                       "女频", "仙侠", "古装", "重生", "豪门", "逆袭", "科普")
          SPORT_KWS = ("体育", "足球", "篮球", "台球", "网球", "斯诺克", "赛事")


          def flat_group(name):
              """分类信息里没有父级 (type_pid) 的站点，按分类名归大类。"""
              g = special_group(name)
              if g:
                  return g
              if any(k in name for k in ("综艺", "演唱会")):
                  return "综艺"
              if any(k in name for k in SHORT_KWS):
                  return "短剧"
              if any(k in name for k in ("动漫", "漫剧")):
                  return "动漫"
              if any(k in name for k in SPORT_KWS):
                  return "体育"
              if name.endswith("片") or "电影" in name:
                  return "电影"
              if name.endswith("剧") or "剧集" in name or "连续剧" in name or name == "电视剧":
                  return "电视剧"
              return "电影"


          def build_type_config(classes):
              """把接口返回的 class 列表整理成 空壳 的 typeConfig：一级分类 -> 二级分类名。"""
              names = [c.get("type_name") for c in classes if c.get("type_name")]
              if not names:
                  return None
              id2name = {c.get("type_id"): c.get("type_name") for c in classes}
              has_tree = any(c.get("type_pid") for c in classes)
              child_count = {}
              for c in classes:
                  if c.get("type_pid"):
                      child_count[c["type_pid"]] = child_count.get(c["type_pid"], 0) + 1
              groups = {}
              for c in classes:
                  name = c.get("type_name")
                  if not name:
                      continue
                  g = special_group(name)
                  if not g:
                      pid = c.get("type_pid") or 0
                      if has_tree and pid == 0 and child_count.get(c.get("type_id")):
                          continue  # 有下级的一级分类只作容器，不再重复列自己
                      parent = id2name.get(pid) if has_tree and pid else None
                      g = norm_parent(parent) if parent else flat_group(name)
                  groups.setdefault(g, []).append(name)
              ordered = {g: groups[g] for g in GROUP_ORDER if groups.get(g)}
              for g, v in groups.items():
                  if g not in ordered:
                      ordered[g] = v
              return ordered


          def fetch_classes(url, timeout=15):
              sep = "&" if "?" in url else "?"
              try:
                  data = json.loads(http_get(url + sep + "ac=list", timeout=timeout))
              except Exception as exc:
                  print(f"    x 分类清单取不到: {type(exc).__name__}")
                  return None
              return data.get("class") or None


          def norm(url):
              return url.strip().rstrip("/")


          def host_of(url):
              """同一站点常出现 /provide/vod 与 /api.php/provide/vod 两种写法，按域名去重。"""
              try:
                  return (urllib.parse.urlparse(url).hostname or "").lower()
              except Exception:
                  return url


          def probe(url):
              """返回 (是否可用, 条目数)。判定标准：HTTP 200 且返回 JSON 内含非空 list。"""
              try:
                  data = json.loads(http_get(url))
              except Exception as exc:  # 超时、非 JSON、被拦都算不可用
                  print(f"    x 不可用: {type(exc).__name__}")
                  return False, None
              lst = data.get("list")
              total = data.get("total") or data.get("total_approx")
              if isinstance(total, (int, float)) and total > 0:
                  return True, int(total)
              if isinstance(lst, list) and lst:
                  return True, None
              return False, None


          def load_base():
              if os.path.exists(CONFIG_PATH):
                  with open(CONFIG_PATH, encoding="utf-8") as f:
                      return json.load(f)
              return {"privateKey": "kongke2026", "tvSources": [], "sources": []}


          def collect_candidates():
              """从维护中的清单抓候选源，返回 [{name,url,from}]。"""
              out = []
              for tag, feed in FEEDS:
                  try:
                      raw = http_get(feed)
                  except Exception as exc:
                      print(f"[skip] {tag} 清单抓取失败: {exc}")
                      continue
                  if tag == "andywe":
                      try:
                          items = json.loads(raw).get("sources", [])
                      except Exception:
                          print("[skip] andywe 清单解析失败")
                          continue
                      for it in items:
                          if it.get("status") not in (None, "ok"):
                              continue
                          if not it.get("url"):
                              continue
                          out.append({
                              "name": it.get("name") or "未命名资源",
                              "url": norm(it["url"]),
                              "from": it.get("from") or "",
                              "total": it.get("total_approx") or None,
                          })
                      print(f"[feed] andywe 候选 {len(out)} 条")
                  else:
                      text = base64.b64decode(raw.strip()).decode("utf-8", "ignore")
                      cnt = 0
                      for line in text.splitlines():
                          line = line.strip()
                          if not line or line.startswith("#"):
                              continue
                          m = re.match(r"^(https?://[^\s#]+)", line)
                          if not m:
                              continue
                          out.append({"name": "", "url": norm(m.group(1)), "from": "", "total": None})
                          cnt += 1
                      print(f"[feed] yh 候选 {cnt} 条")
              return out


          def main():
              base = load_base()
              sources = base.get("sources", [])
              known = {host_of(s.get("url", "")) for s in sources}
              print(f"[base] 已有 {len(sources)} 个点播源")

              # 1) 刷已有点播源的信息
              verified = 0
              for s in sources:
                  url = norm(s.get("url", ""))
                  print(f"  - 复检 {s.get('name', url)}")
                  is_line = "专线" in (s.get("name") or "")
                  if not BLOCK_TYPES and not is_line:
                      s.pop("blockTypeName", None)
                  if is_line:
                      # 成人专线：分类写成固定的「只留成人」，不让每日更新覆盖回全量分类
                      ok, total = probe(url)
                      s["_ok"] = ok
                      if ok:
                          verified += 1
                      s["_total"] = None
                      continue
                  classes = fetch_classes(url)
                  if classes:
                      tc = build_type_config(classes)
                      if tc:
                          s["typeConfig"] = tc
                  ok, total = probe(url)
                  s["_ok"] = ok
                  if ok:
                      verified += 1
                  prev_total = int(re.sub(r"[^0-9]", "", s.get("desc", "")) or 0) or None
                  if total:
                      # 片库量每天会小幅浮动，取整百避免天天产生无意义提交
                      suffix = ""
                      if "｜" in s.get("desc", ""):
                          suffix = "｜" + s["desc"].split("｜", 1)[1]
                      s["desc"] = f"片库约{int(round(total / 100.0) * 100)}{suffix}"
                      s["_total"] = int(round(total / 100.0) * 100)
                  else:
                      # 本机被拦或接口抽风时，沿用上次记录的数量，保证排序稳定、不误删
                      s["_total"] = prev_total

              # 2) 追加新源（必须本次实测可用，且 URL 未重复）
              added = 0
              for c in collect_candidates():
                  h = host_of(c["url"])
                  if h in known:
                      continue
                  print(f"  + 新增候选 {c['url']}")
                  ok, total = probe(c["url"])
                  if not ok:
                      continue
                  entry = {
                      "name": c["name"] or h,
                      "url": c["url"],
                      "blockAdsRule": [],
                      "desc": f"片库约{total}" if total else "",
                      "_ok": True,
                      "_total": total,
                  }
                  if BLOCK_TYPES:
                      entry["blockTypeName"] = list(BLOCK_TYPES)
                  classes = fetch_classes(c["url"])
                  if classes:
                      tc = build_type_config(classes)
                      if tc:
                          entry["typeConfig"] = tc
                  if c["from"]:
                      entry["playerName"] = {c["from"]: entry["name"]}
                  sources.append(entry)
                  known.add(h)
                  added += 1

              # 3) 按片库量降序，未知排最后；清掉内部字段
              def tier_rank(s):
                  n = s.get("name", "")
                  if n.endswith("·快"):
                      return 0
                  if n.endswith("·中"):
                      return 1
                  if n.endswith("·慢"):
                      return 2
                  return 3
              sources.sort(key=lambda s: (tier_rank(s), -(s.get("_total") or 0)))
              for s in sources:
                  s.pop("_ok", None)
                  s.pop("_total", None)
                  if not s.get("desc"):
                      s.pop("desc", None)

              cfg = {
                  "privateKey": base.get("privateKey", "kongke2026"),
                  "tvSources": base.get("tvSources", []),
                  "sources": sources,
              }
              with open(CONFIG_PATH, "w", encoding="utf-8") as f:
                  json.dump(cfg, f, ensure_ascii=False, indent=2)
                  f.write("\n")

              print(f"[done] 写入 {CONFIG_PATH}：共 {len(sources)} 个源；本次复检可用 {verified} 个，新增 {added} 个")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 /tmp/build_config.py
          python3 -c "import json;d=json.load(open('config.json'));print('校验通过:',len(d['sources']),'个源, 带分类配置', sum(1 for s in d['sources'] if s.get('typeConfig')))"

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          if git diff --cached --quiet; then
            echo "config.json 无变化，跳过提交"
          else
            git commit -m "chore: 自动更新影视源 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
