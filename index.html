<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>影视源配置 · 空壳可用</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --line:#1e2733; --txt:#e8eeff;
    --sub:#8b98ad; --accent:#3fb6ff; --ok:#2fbf6b; --warn:#e0a03a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 20% -10%,#16324a 0,#0b0f14 60%),var(--bg);
    color:var(--txt);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;padding:28px 18px 60px;
  }
  .wrap{max-width:920px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
  h1{font-size:26px;letter-spacing:.5px;font-weight:600}
  h1 span{color:var(--accent)}
  .meta{color:var(--sub);font-size:13px}
  .keybox{
    background:linear-gradient(180deg,#16222f,#121821);border:1px solid #26405a;border-radius:12px;
    padding:12px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s;
  }
  .keybox:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,182,255,.12)}
  .keybox small{display:block;color:var(--sub);font-size:12px;letter-spacing:1px}
  .keybox b{font:600 20px/1.2 ui-monospace,Menlo,Consolas,monospace;color:var(--accent);letter-spacing:2px}
  .keybox i{font-style:normal;font-size:12px;color:var(--sub);border-left:1px solid #26405a;padding-left:14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat b{display:block;font-size:22px;font-family:ui-monospace,Menlo,monospace}
  .stat small{color:var(--sub);font-size:12px}
  .bar{display:flex;gap:10px;margin-bottom:14px}
  input[type=search]{
    flex:1;background:#0f151d;border:1px solid var(--line);border-radius:10px;color:var(--txt);
    padding:11px 14px;font-size:14px;outline:none;
  }
  input[type=search]:focus{border-color:var(--accent)}
  button{
    background:#16222f;border:1px solid #26405a;color:var(--txt);border-radius:10px;padding:0 16px;
    font-size:14px;cursor:pointer;transition:.2s;
  }
  button:hover{border-color:var(--accent);color:var(--accent)}
  ul{list-style:none;display:grid;gap:10px}
  li{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;transition:.2s;
  }
  li:hover{border-color:#26405a;background:#151d28}
  .nm{display:flex;align-items:center;gap:9px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--sub);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px rgba(47,191,107,.6)}
  .url{color:var(--sub);font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;margin-top:5px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{font-size:11px;color:#8fd8ff;background:rgba(63,182,255,.1);border:1px solid rgba(63,182,255,.25);border-radius:6px;padding:2px 7px}
  .copy{font-size:12px;padding:7px 12px;white-space:nowrap}
  footer{margin-top:32px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
  footer h2{font-size:16px;margin-bottom:12px}
  footer ol{padding-left:20px;color:var(--sub);font-size:14px}
  footer ol li{
    display:list-item;background:none;border:0;border-radius:0;padding:0;
    margin:0 0 9px;grid-template-columns:none;color:var(--sub);font-size:14px;
  }
  footer ol li code,footer code{color:#9fe2ff;background:rgba(63,182,255,.08);border-radius:4px;padding:1px 5px;font-size:12px}
  .addr{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
  .addr code{
    flex:1;min-width:220px;background:#0f151d;border:1px dashed #26405a;border-radius:8px;
    padding:10px 12px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#9fe2ff;word-break:break-all;
  }
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;
    background:#16222f;border:1px solid #26405a;color:var(--txt);padding:10px 18px;border-radius:10px;
    font-size:13px;transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:560px){
    .stats{grid-template-columns:1fr 1fr}
    li{grid-template-columns:1fr}
    .copy{justify-self:flex-start}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>影视源配置 · <span>空壳可用</span></h1>
      <div class="meta" id="meta">加载中…</div>
    </div>
    <div class="keybox" id="keybox" title="点击复制隐私码">
      <div>
        <small>隐私码 PRIVACY KEY</small>
        <b id="key">----</b>
      </div>
      <i>访问本页即可看到<br>App 内输入即可导入全部源</i>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="n-src">0</b><small>点播源</small></div>
    <div class="stat"><b id="n-tv">0</b><small>直播源</small></div>
    <div class="stat"><b id="n-block">0</b><small>已细分分类</small></div>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="搜索源名称或接口域名…">
    <button id="cp-all">复制全部接口</button>
  </div>

  <ul id="list"></ul>

  <footer>
    <h2>怎么用</h2>
    <ol>
      <li>打开「空壳影视」→ 设置 → 配置地址，粘贴下方这个 json 地址。</li>
      <li>提示隐私码时，输入页面顶部显示的 code 即可导入全部源。</li>
      <li>广告多的源可在配置里加 <code>blockAdsRule</code> 正则；失效源换域名即可。</li>
    </ol>
    <div class="addr">
      <code id="addr">loading…</code>
      <button id="cp-addr">复制地址</button>
    </div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const FALLBACK = null; // 预留：如需离线单文件，可把 config.json 内容粘到这里
const MASK_BLOCK = ["伦理片","理论片","福利","韩国伦理","港台三级","两性课堂","写真热舞"];

let CFG = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'),1800);
}
async function copy(text,label){
  try{
    await navigator.clipboard.writeText(text);
    toast(label+' 已复制');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast(label+' 已复制');
  }
}

function render(){
  const cfg = CFG || FALLBACK;
  if(!cfg){ document.getElementById('meta').textContent='未找到 config.json，请与页面放在同一目录'; return; }
  const sources = cfg.sources || [];
  const tvs = cfg.tvSources || [];
  document.getElementById('key').textContent = cfg.privateKey || '无';
  document.getElementById('n-src').textContent = sources.length;
  document.getElementById('n-tv').textContent = tvs.length;
  document.getElementById('n-block').textContent = sources.filter(s=>s.typeConfig).length;

  const addr = location.href.replace(/[^/]*$/,'') + 'config.json';
  document.getElementById('addr').textContent = addr;
  document.getElementById('meta').textContent =
    `配置加载成功 · 共 ${sources.length} 个点播源 · ${new Date().toLocaleDateString('zh-CN')}`;

  const list = document.getElementById('list');
  list.innerHTML = '';
  sources.forEach(s=>{
    const li=document.createElement('li');
    const pn = s.playerName ? Object.keys(s.playerName).join(', ') : '';
    li.innerHTML = `
      <div>
        <div class="nm"><span class="dot"></span>${escapeHtml(s.name)}</div>
        <div class="url">${escapeHtml(s.url)}</div>
        <div class="tags">
          ${s.desc?`<span class="tag">${escapeHtml(s.desc)}</span>`:''}
          ${pn?`<span class="tag">线路 ${escapeHtml(pn)}</span>`:''}
          ${s.typeConfig?`<span class="tag">二级分类 ${Object.keys(s.typeConfig).length} 组</span>`:''}
        </div>
      </div>
      <button class="copy" data-url="${escapeHtml(s.url)}">复制</button>`;
    list.appendChild(li);
  });
  list.querySelectorAll('.copy').forEach(b=>{
    b.onclick = ()=> copy(b.dataset.url,'接口地址');
  });

  const q = document.getElementById('q');
  q.oninput = ()=>{
    const v = q.value.trim().toLowerCase();
    list.querySelectorAll('li').forEach((li,i)=>{
      const s = sources[i];
      const hit = !v || (s.name+s.url).toLowerCase().includes(v);
      li.style.display = hit ? '' : 'none';
    });
  };
}
function escapeHtml(s=''){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('keybox').onclick = ()=> copy(document.getElementById('key').textContent,'隐私码');
document.getElementById('cp-addr').onclick = ()=> copy(document.getElementById('addr').textContent,'配置地址');
document.getElementById('cp-all').onclick = ()=>{
  const cfg=CFG||FALLBACK; if(!cfg) return;
  copy((cfg.sources||[]).map(s=>s.url).join('\n'),'全部接口');
};

fetch('config.json',{cache:'no-store'})
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ CFG=d; render(); })
  .catch(()=>{ CFG=FALLBACK; render(); });
</script>
</body>
</html>
